<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shroom Buddies</title>
<meta name="description" content="Shroom Buddies: daily practices, check-ins, journal, tracker, guides and reels. Free, and kept only on your phone.">
<meta property="og:type" content="website">
<meta property="og:title" content="Shroom Buddies">
<meta property="og:description" content="A free app for microdosing check-ins, a tracker, journal, practices and guides. Everything stays private on your phone.">
<meta property="og:url" content="https://longzdalez.github.io/Shroom-Buddies-2/">
<meta property="og:image" content="https://longzdalez.github.io/Shroom-Buddies-2/img/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#081226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shroom Buddies">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@600&display=swap">
<link rel="stylesheet" href="style-v3.css">
<link rel="stylesheet" href="style-v5-extra.css">
</head>
<body class="splashing">
  <div id="bg"></div>
  <canvas id="sparkles" aria-hidden="true"></canvas>

  <div id="splash" role="button" tabindex="0" aria-label="Enter Shroom Buddies">
    <div class="glow"></div>
    <img class="logo" src="img/logo.svg" alt="">
    <div class="title">Shroom Buddies</div>
    <div class="sub">A Guide to the Use of Psilocybin Mushrooms</div>
    <div class="tap">tap to enter</div>
  </div>

  <header>
    <button id="homeBtn" class="icon left" aria-label="Home"><svg class="home-ico" viewBox="0 0 26 26" aria-hidden="true"><defs><linearGradient id="homeGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset=".55" stop-color="#f4cf6e"/><stop offset="1" stop-color="#c8952f"/></linearGradient></defs><path d="M3.2 12.4 13 4l9.8 8.4" fill="none" stroke="url(#homeGold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11v9.6c0 .9.6 1.6 1.4 1.6h3.8v-5.4a1.8 1.8 0 0 1 3.6 0v5.4h3.8c.8 0 1.4-.7 1.4-1.6V11" fill="none" stroke="url(#homeGold)" stroke-width="2.1" stroke-linejoin="round"/><path d="M21 2.2l.55 1.35 1.350.55-1.35.55L21 6l-.55-1.35-1.35-.55 1.35-.55z" fill="#fff2c2"/></svg></button>
    <h1 class="brand" aria-label="Shroom Buddies"><span>Shroom</span><img src="img/logo.svg" alt=""><span>Buddies</span></h1>
    <button id="forumBtn" class="icon" aria-label="Message Centre"><svg class="chat-ico" viewBox="0 0 26 26" aria-hidden="true"><defs><linearGradient id="chatGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset=".55" stop-color="#f4cf6e"/><stop offset="1" stop-color="#c8952f"/></linearGradient></defs><path d="M5.2 4.6h15.6c1.3 0 2.2.9 2.2 2.2v9.1c0 1.3-.9 2.2-2.2 2.2h-8.4l-4.6 3.9v-3.9H5.2C3.9 18.1 3 17.2 3 15.9V6.8c0-1.3.9-2.2 2.2-2.2z" fill="none" stroke="url(#chatGold)" stroke-width="2.1" stroke-linejoin="round"/><circle cx="8.6" cy="11.4" r="1.25" fill="url(#chatGold)"/><circle cx="13" cy="11.4" r="1.25" fill="url(#chatGold)"/><circle cx="17.4" cy="11.4" r="1.25" fill="url(#chatGold)"/></svg><i class="chat-dot"></i></button>
    <button id="settingsBtn" class="icon" aria-label="Settings"><svg class="gear-ico" viewBox="0 0 26 26" aria-hidden="true"><defs><linearGradient id="gearGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset=".55" stop-color="#f4cf6e"/><stop offset="1" stop-color="#c8952f"/></linearGradient></defs><path d="M11.3 3.2h3.4l.5 2.4c.6.2 1.2.5 1.7.9l2.3-.8 1.7 2.9-1.8 1.6c.1.6.1 1.2 0 1.8l1.8 1.6-1.7 2.9-2.3-.8c-.5.4-1.1.7-1.7.9l-.5 2.4h-3.4l-.5-2.4c-.6-.2-1.2-.5-1.7-.9l-2.3.8-1.7-2.9 1.8-1.6c-.1-.6-.1-1.2 0-1.8L5.1 8.6l1.7-2.9 2.3.8c.5-.4 1.1-.7 1.7-.9z" transform="translate(0 1.1)" fill="none" stroke="url(#gearGold)" stroke-width="2" stroke-linejoin="round"/><circle cx="13" cy="13" r="3.1" fill="none" stroke="url(#gearGold)" stroke-width="2"/><path d="M5 21.6l.45 1.1 1.1.45-1.1.45L5 24.7l-.45-1.1-1.1-.45 1.1-.45z" fill="#fff2c2"/></svg></button>
  </header>

  <div id="pageName" aria-live="polite"></div>
  <main id="view"></main>

  <nav id="nav">
    <div id="navGlow"></div>
    <button data-go="tracker"><span class="ico"><img class="shroom" src="img/logo.svg" alt=""></span><span>Tracker</span></button>
    <button data-go="graph"><span class="ico">📈</span><span>Graph</span></button>
    <button data-go="intentions"><span class="ico">🎯</span><span>Intentions</span></button>
    <button data-go="practices"><span class="ico">🧘</span><span>Practices</span></button>
    <button data-go="journal"><span class="ico">📓</span><span>Journal</span></button>
    <button data-go="nourish"><span class="ico">🥗</span><span>Food</span></button>
    <button data-go="inspiration"><span class="ico">💡</span><span>Literature</span></button>
    <button data-go="guides"><span class="ico">📖</span><span>Guides</span></button>
  </nav>

  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><button id="sheetBack" class="ghost small hidden" aria-label="Back">‹</button><h2 id="sheetTitle"></h2><button id="sheetClose" class="ghost small" aria-label="Close">✕</button></div>
    <div id="sheetBody"></div>
  </div>
  <div id="popup" role="dialog" aria-modal="true"><div class="popup-box"><div class="sheet-head"><h2 id="popupTitle"></h2><button id="popupClose" class="ghost small" aria-label="Close">✕</button></div><div id="popupBody"></div></div></div>

  <div id="toast" role="status"><span id="toastText"></span><button id="toastBtn" class="small hidden">Undo</button></div>
  <div id="fx" aria-hidden="true"></div>
  <script src="app-v5.js"></script>
  <script src="forum-v1.js"></script>
  <script src="about-v1.js"></script>
</body>
</html>
